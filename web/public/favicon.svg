<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#152238"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Tactical Radar Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="3" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#334155" stroke-width="2"/>
  <circle cx="256" cy="256" r="90" fill="none" stroke="url(#emeraldGlow)" stroke-width="3" opacity="0.6"/>

  <!-- Glowing Compass & Footstep Audio Waves -->
  <!-- Audio Waves Left & Right -->
  <path d="M 120 220 A 150 150 0 0 0 120 292" fill="none" stroke="url(#emeraldGlow)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 90 190 A 190 190 0 0 0 90 322" fill="none" stroke="url(#emeraldGlow)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M 392 220 A 150 150 0 0 1 392 292" fill="none" stroke="url(#amberGlow)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 422 190 A 190 190 0 0 1 422 322" fill="none" stroke="url(#amberGlow)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Central Rune / Dungeon Compass Motif -->
  <polygon points="256,120 290,230 256,210 222,230" fill="url(#emeraldGlow)" filter="url(#glow)"/>
  <polygon points="256,392 290,282 256,302 222,282" fill="#475569"/>
  <circle cx="256" cy="256" r="24" fill="#090d16" stroke="url(#emeraldGlow)" stroke-width="4"/>
  <circle cx="256" cy="256" r="10" fill="#10b981"/>
</svg>
